name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Python syntax check
        run: uv run python -m py_compile src/l30_o20_dashboard/*.py
      - name: JavaScript syntax check
        run: |
          node --check src/l30_o20_dashboard/static/app.js
          node --check src/l30_o20_dashboard/static/o20.js
          node --check src/l30_o20_dashboard/static/follow.js
          node --check src/l30_o20_dashboard/static/gesture.js
