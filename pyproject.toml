[project]
name = "l30-o20-dashboard"
version = "0.1.0"
description = "L30/O20 CANFD dashboard with multi-device control, dance sequences, RPS, and gesture follow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
legacy-vision = [
    "mediapipe>=0.10.14; python_version < '3.13'",
    "opencv-python>=4.10.0; python_version < '3.13'",
]

[project.scripts]
l30-o20-dashboard = "l30_o20_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
